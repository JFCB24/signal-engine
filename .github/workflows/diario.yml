name: prueba-en-vivo

on:
  schedule:
    # 00:30 UTC: el cierre diario de BTC ya ocurrió (00:00 UTC)
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - name: Ejecutar proceso diario
        run: python -m models.diario
      - name: Guardar registro en el repo
        run: |
          git config user.name "Juan Felipe Castellanos Bran"
          git config user.email "juanfelipecastellanosbran@gmail.com"
          git add data/registro_senales.csv reportes/
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "registro diario de señales"
            git push
          fi
